[workspace]
members = [
    "crates/walle-cli",
    "crates/walle-common",
    "crates/walle-daemon",
    "crates/walle-ebpf",
    "crates/walle-policy",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
aya = "0.13.1"
aya-ebpf = "0.1.1"
clap = { version = "4", features = ["derive"] }
rand = "0.10"
russh = { version = "0.60", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
